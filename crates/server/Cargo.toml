[package]
name = "agora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Agora: an internal AI platform with auditing, usage tracking and SSO"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.6.0"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
base64 = "0.23.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures = "0.3"
hex = "0.4"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
openidconnect = "4.1.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8", features = ["mime-guess"] }
samael = { version = "0.0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "limit", "set-header", "timeout", "request-id", "util", "catch-panic", "propagate-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls"] }

[features]
default = []
# SAML 2.0 single sign-on (needs libxml2 + xmlsec1 development packages at build time)
saml = ["dep:samael"]

[lints]
workspace = true
